// ============================================================
// ESTADO

let currentIndex = 1;


// ============================================================
// ABRIR DOCUMENTO
// ============================================================

function openDoc(index) {


  if (
    index < 1 ||
    index > docs.length
  ) {

    return;
  }


  currentIndex = index;


  const doc = docs[
    currentIndex - 1
  ];


  // ----------------------------------------------------------
  // Cargar HTML
  // ----------------------------------------------------------

  document
    .getElementById(
      "docframe"
    )
    .src = doc.html;


  // ----------------------------------------------------------
  // Título
  // ----------------------------------------------------------

  document
    .getElementById(
      "currentTitle"
    )
    .textContent = doc.title;


  // ----------------------------------------------------------
  // Categoría
  // ----------------------------------------------------------

  document
    .getElementById(
      "currentCategory"
    )
    .textContent = doc.category;


  // ----------------------------------------------------------
  // Contador
  // ----------------------------------------------------------

  document
    .getElementById(
      "counter"
    )
    .textContent =
      "Documento " +
      currentIndex +
      " de " +
      docs.length;


  // ----------------------------------------------------------
  // Botones anterior / siguiente
  // ----------------------------------------------------------

  document
    .getElementById(
      "prevButton"
    )
    .disabled =
      currentIndex === 1;


  document
    .getElementById(
      "nextButton"
    )
    .disabled =
      currentIndex === docs.length;


  // ----------------------------------------------------------
  // Resaltar menú
  // ----------------------------------------------------------

  document
    .querySelectorAll(
      ".doc-link"
    )
    .forEach(
      function(button) {

        button
          .classList
          .remove(
            "active"
          );
      }
    );


  const activeButton =
    document.querySelector(
      `.doc-link[data-doc-index="${currentIndex}"]`
    );


  if (
    activeButton
  ) {

    activeButton
      .classList
      .add(
        "active"
      );


    // --------------------------------------------------------
    // Asegurar sección visible
    // --------------------------------------------------------

    const content =
      activeButton.closest(
        ".section-content"
      );


    if (
      content
    ) {

      content.style.display =
        "block";


      const section =
        content.closest(
          ".section"
        );


      const arrow =
        section.querySelector(
          ".arrow"
        );


      if (
        arrow
      ) {

        arrow.textContent =
          "▾";
      }
    }
  }
}


// ============================================================
// DOCUMENTO ANTERIOR
// ============================================================

function previousDoc() {

  if (
    currentIndex > 1
  ) {

    openDoc(
      currentIndex - 1
    );
  }
}


// ============================================================
// DOCUMENTO SIGUIENTE
// ============================================================

function nextDoc() {

  if (
    currentIndex < docs.length
  ) {

    openDoc(
      currentIndex + 1
    );
  }
}


// ============================================================
// ABRIR WORD ORIGINAL
// ============================================================

function openWord() {

  const doc = docs[
    currentIndex - 1
  ];


  if (
    !doc
  ) {

    return;
  }


  // El comportamiento dependerá del navegador:
  //
  // - puede abrir Word
  // - puede descargar DOCX
  // - puede abrir vista previa
  //
  // En todos los casos apunta al documento original copiado.

  window.open(
    doc.word,
    "_blank"
  );
}


// ============================================================
// PLEGAR / DESPLEGAR SECCIÓN
// ============================================================

function toggleSection(button) {

  const content =
    button.nextElementSibling;


  const arrow =
    button.querySelector(
      ".arrow"
    );


  if (
    content.style.display === "none"
  ) {

    content.style.display =
      "block";


    if (
      arrow
    ) {

      arrow.textContent =
        "▾";
    }

  } else {

    content.style.display =
      "none";


    if (
      arrow
    ) {

      arrow.textContent =
        "▸";
    }
  }
}


// ============================================================
// BUSCADOR
// ============================================================

function filterDocs() {


  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


  const sections =
    document
      .querySelectorAll(
        ".section"
      );


  sections.forEach(

    function(section) {


      const links =
        section
          .querySelectorAll(
            ".doc-link"
          );


      let visible = 0;


      links.forEach(

        function(link) {


          const searchText =
            link
              .getAttribute(
                "data-search"
              );


          if (
            query === "" ||
            searchText.includes(
              query
            )
          ) {

            link.style.display =
              "flex";

            visible++;

          } else {

            link.style.display =
              "none";
          }
        }
      );


      if (
        visible > 0
      ) {

        section.style.display =
          "block";


        if (
          query !== ""
        ) {

          const body =
            section.querySelector(
              ".section-content"
            );


          body.style.display =
            "block";


          const arrow =
            section.querySelector(
              ".arrow"
            );


          if (
            arrow
          ) {

            arrow.textContent =
              "▾";
          }
        }

      } else {

        section.style.display =
          "none";
      }
    }
  );
}

document.addEventListener(

    // Alt + flecha izquierda
    // --------------------------------------------------------

    if (
      event.altKey &&
      event.key === "ArrowLeft"
    ) {

      event.preventDefault();

    // --------------------------------------------------------

    // --------------------------------------------------------

    if (
      event.altKey &&
      event.key === "ArrowRight"
    ) {

      event.preventDefault();

      nextDoc();
    }
  }
);


// ============================================================
// INICIALIZACIÓN
// ============================================================

window.addEventListener(

  "DOMContentLoaded",

  function() {

    openDoc(1);
  }
);


</script>
